<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarHub 🚗</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f1a;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #15152a;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .car {
      background: #1c1c33;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 12px;
      transition: 0.3s;
    }

    .car:hover {
      transform: scale(1.02);
      background: #242444;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .specs {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 5px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      background: #4c6fff;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<header>
  🚗 CarHub - Bil database
</header>

<div class="container">

  <input type="text" id="search" placeholder="Søg efter bil (fx BMW, Tesla, Audi...)">

  <div id="carList"></div>

</div>

<script>
  const cars = [
    {
      name: "Tesla Model 3",
      hp: 450,
      type: "Elbil",
      speed: "0-100: 3.3s"
    },
    {
      name: "BMW M3 Competition",
      hp: 510,
      type: "Benzin",
      speed: "0-100: 3.9s"
    },
    {
      name: "Audi RS5",
      hp: 450,
      type: "Benzin",
      speed: "0-100: 4.1s"
    },
    {
      name: "Mercedes C63 AMG",
      hp: 476,
      type: "Benzin",
      speed: "0-100: 3.9s"
    }
  ];

  const carList = document.getElementById("carList");
  const search = document.getElementById("search");

  function renderCars(filter = "") {
    carList.innerHTML = "";

    const filtered = cars.filter(car =>
      car.name.toLowerCase().includes(filter.toLowerCase())
    );

    filtered.forEach(car => {
      carList.innerHTML += `
        <div class="car">
          <div class="title">${car.name}</div>
          <div class="specs">⚡ ${car.hp} HP</div>
          <div class="specs">⛽ Type: ${car.type}</div>
          <div class="badge">${car.speed}</div>
        </div>
      `;
    });
  }

  search.addEventListener("input", (e) => {
    renderCars(e.target.value);
  });

  renderCars();
</script>

</body>
</html>
