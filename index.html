<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VT AI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f19;
  color: white;
  display: flex;
  height: 100vh;
  flex-direction: column;
}

header {
  padding: 15px;
  text-align: center;
  background: #111827;
  font-size: 20px;
  font-weight: bold;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
}

.msg {
  max-width: 70%;
  padding: 12px;
  margin: 10px;
  border-radius: 12px;
  line-height: 1.4;
}

.user {
  background: #2563eb;
  margin-left: auto;
}

.ai {
  background: #1f2937;
  margin-right: auto;
}

.input-area {
  display: flex;
  padding: 10px;
  background: #111827;
}

input {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  outline: none;
}

button {
  margin-left: 10px;
  padding: 12px 16px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

@media (max-width: 600px) {
  .msg {
    max-width: 85%;
  }
}
</style>
</head>

<body>

<header>🤖 VT AI (HTML MODE)</header>

<div id="chat"></div>

<div class="input-area">
  <input id="input" placeholder="Skriv noget..." />
  <button onclick="send()">Send</button>
</div>

<script>
function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 999999;
}

// 🧠 "Fake AI hjerne"
function aiResponse(input) {
  input = input.toLowerCase();

  if (input.includes("hej")) return "Hej 👋 Jeg er VT AI!";
  if (input.includes("hvem er du")) return "Jeg er en simpel AI lavet i HTML 😄";
  if (input.includes("hvad kan du")) return "Jeg kan svare på simple ting og chatte med dig 🤖";
  if (input.includes("navn")) return "Jeg hedder VT AI";
  if (input.includes("farvel")) return "Farvel 👋 Hav en god dag!";

  return "Hmm 🤔 Jeg forstår ikke helt, men jeg lærer stadig!";
}

function send() {
  const input = document.getElementById("input");
  const text = input.value;

  if (!text) return;

  addMessage(text, "user");

  setTimeout(() => {
    addMessage(aiResponse(text), "ai");
  }, 500);

  input.value = "";
}
</script>

</body>
</html>
