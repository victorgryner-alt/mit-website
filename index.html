<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>NEO OS V4</title>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:linear-gradient(135deg,#0f172a,#020617);
  color:white;
  overflow:hidden;
}

/* LOGIN */
#login {
  position:fixed; inset:0;
  display:flex; justify-content:center; align-items:center;
  background:black;
}

.card {
  background:#111; padding:20px; border-radius:10px;
}

/* DESKTOP */
#desktop { display:none; height:100vh; }

/* ICONS */
.icon {
  width:80px; text-align:center; cursor:pointer;
}

/* TASKBAR */
#taskbar {
  position:fixed; bottom:0; width:100%;
  height:40px; background:#111;
  display:flex; justify-content:space-between; padding:0 10px;
}

/* WINDOW */
.window {
  position:absolute;
  width:320px;
  height:220px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border-radius:12px;
  transition:0.2s;
}

.titlebar {
  padding:5px;
  background:rgba(255,255,255,0.1);
  cursor:move;
  display:flex;
  justify-content:space-between;
}

.btns span { margin-left:5px; cursor:pointer; }

/* GAME */
canvas { background:black; }

/* MENU */
#menu {
  position:absolute;
  display:none;
  background:#222;
  padding:5px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <input id="user" placeholder="username"><br>
    <button onclick="login()">Enter</button>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop">

<div class="icon" onclick="openApp('ai')">🤖 AI</div>
<div class="icon" onclick="openApp('browser')">🌐 Browser</div>
<div class="icon" onclick="openApp('notes')">📝 Notes</div>
<div class="icon" onclick="openApp('game')">🎮 Game</div>

<div id="taskbar">
  <span>NEO OS</span>
  <span id="clock"></span>
</div>

<div id="menu">Open | Delete</div>

</div>

<script>
/* CLOCK */
setInterval(()=>{
  document.getElementById("clock").textContent=new Date().toLocaleTimeString();
},1000);

/* LOGIN */
let currentUser=localStorage.getItem("user");

function login(){
  currentUser=document.getElementById("user").value;
  localStorage.setItem("user",currentUser);
  start();
}

function start(){
  document.getElementById("login").style.display="none";
  document.getElementById("desktop").style.display="block";
}
if(currentUser) start();

/* SOUND */
function clickSound(){
  new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg").play();
}

/* WINDOW SYSTEM */
function openApp(name){
  clickSound();

  let win=document.createElement("div");
  win.className="window";
  win.style.top="100px";
  win.style.left="100px";

  win.innerHTML=`
    <div class="titlebar">
      ${name}
      <div class="btns">
        <span onclick="minWin(this)">_</span>
        <span onclick="maxWin(this)">□</span>
        <span onclick="closeWin(this)">X</span>
      </div>
    </div>
    <div class="content"></div>
  `;

  document.body.appendChild(win);
  drag(win);
  snap(win);

  let c=win.querySelector(".content");

  if(name==="ai") aiApp(c);
  if(name==="browser") browserApp(c);
  if(name==="notes") notesApp(c);
  if(name==="game") gameApp(c);
}

/* DRAG */
function drag(el){
  let bar=el.querySelector(".titlebar");

  bar.onmousedown=e=>{
    let x=e.clientX-el.offsetLeft;
    let y=e.clientY-el.offsetTop;

    document.onmousemove=e=>{
      el.style.left=(e.clientX-x)+"px";
      el.style.top=(e.clientY-y)+"px";
    };
    document.onmouseup=()=>document.onmousemove=null;
  };
}

/* SNAP */
function snap(el){
  document.addEventListener("mouseup",()=>{
    if(el.offsetLeft<50){
      el.style.left=0;
      el.style.width="50%";
    }
    if(window.innerWidth-el.offsetLeft<50){
      el.style.left="50%";
      el.style.width="50%";
    }
  });
}

/* WINDOW CONTROLS */
function closeWin(e){ e.closest(".window").remove(); }
function minWin(e){ e.closest(".window").style.display="none"; }
function maxWin(e){
  let w=e.closest(".window");
  w.style.top=0;
  w.style.left=0;
  w.style.width="100%";
  w.style.height="100%";
}

/* AI */
let memory=[];

function aiApp(c){
  c.innerHTML=`<div id="chat"></div><input id="i">`;

  let chat=c.querySelector("#chat");
  let input=c.querySelector("#i");

  input.onkeydown=e=>{
    if(e.key==="Enter"){
      let msg=input.value;
      memory.push(msg);

      add("You: "+msg);
      respond(msg);

      input.value="";
    }
  };

  function add(t){
    let d=document.createElement("div");
    d.textContent=t;
    chat.appendChild(d);
  }

  function respond(q){
    let r="";

    if(q.includes("hej")) r="Hej "+currentUser+" 👋";
    else if(q.includes("projekt")) r="Du burde bygge noget virkelig unikt.";
    else if(q.includes("ide")) r="Lav en startup med AI + gaming.";
    else if(memory.length>5) r="Jeg begynder at forstå dig bedre nu.";
    else r="Fortæl mig mere...";

    type(r);
  }

  function type(t){
    let d=document.createElement("div");
    chat.appendChild(d);

    let i=0;
    let int=setInterval(()=>{
      d.textContent+=t[i];
      i++;
      if(i>=t.length) clearInterval(int);
    },15);
  }
}

/* NOTES */
function notesApp(c){
  let saved=localStorage.getItem("notes")||"";
  c.innerHTML=`<textarea style="width:100%;height:150px;">${saved}</textarea>`;

  let ta=c.querySelector("textarea");
  ta.oninput=()=>localStorage.setItem("notes",ta.value);
}

/* BROWSER */
let bookmarks=["https://example.com"];

function browserApp(c){
  c.innerHTML=`
    <input id="url">
    <button id="go">Go</button>
    <button id="save">★</button>
    <div id="bookmarks"></div>
    <iframe style="width:100%;height:120px;"></iframe>
  `;

  let url=c.querySelector("#url");
  let frame=c.querySelector("iframe");

  c.querySelector("#go").onclick=()=>frame.src=url.value;

  c.querySelector("#save").onclick=()=>{
    bookmarks.push(url.value);
    render();
  };

  function render(){
    let b=c.querySelector("#bookmarks");
    b.innerHTML="";
    bookmarks.forEach(link=>{
      let d=document.createElement("div");
      d.textContent=link;
      d.onclick=()=>frame.src=link;
      b.appendChild(d);
    });
  }

  render();
}

/* GAME */
function gameApp(c){
  let canvas=document.createElement("canvas");
  canvas.width=400;
  canvas.height=250;
  c.appendChild(canvas);

  let ctx=canvas.getContext("2d");

  let player={x:50,y:50,hp:100};
  let enemies=[{x:300,y:100}];
  let bullets=[];
  let score=0;

  document.onkeydown=e=>{
    if(e.key==="w") player.y-=5;
    if(e.key==="s") player.y+=5;
    if(e.key==="a") player.x-=5;
    if(e.key==="d") player.x+=5;
    if(e.key===" ") bullets.push({x:player.x,y:player.y});
  };

  function loop(){
    ctx.clearRect(0,0,400,250);

    ctx.fillText("HP:"+player.hp+" Score:"+score,10,10);

    ctx.fillStyle="cyan";
    ctx.fillRect(player.x,player.y,10,10);

    ctx.fillStyle="red";
    enemies.forEach(e=>{
      ctx.fillRect(e.x,e.y,10,10);

      e.x += (player.x-e.x)*0.01;
      e.y += (player.y-e.y)*0.01;

      if(Math.abs(player.x-e.x)<10 && Math.abs(player.y-e.y)<10){
        player.hp-=1;
      }
    });

    ctx.fillStyle="yellow";
    bullets.forEach(b=>{
      b.x+=5;
      ctx.fillRect(b.x,b.y,5,5);

      enemies.forEach((e,i)=>{
        if(Math.abs(b.x-e.x)<10 && Math.abs(b.y-e.y)<10){
          enemies.splice(i,1);
          score++;
        }
      });
    });

    requestAnimationFrame(loop);
  }

  loop();
}

/* RIGHT CLICK */
document.addEventListener("contextmenu",e=>{
  e.preventDefault();
  let m=document.getElementById("menu");
  m.style.display="block";
  m.style.left=e.pageX+"px";
  m.style.top=e.pageY+"px";
});

document.addEventListener("click",()=>{
  document.getElementById("menu").style.display="none";
});
</script>

</body>
</html>
