<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Min AI</title>
<style>
:root{--bg:#f3f1fb;--side:#e8e5f6;--panel:#fff;--ink:#1a1840;--mut:#6d6a94;--line:#d6d2ee;--me:#5b3df0;--acc:#ff9f45;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0d1024;--side:#121634;--panel:#1a1f45;--ink:#eceefc;--mut:#9a9fcb;--line:#2a3064;--me:#6f55ff}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Avenir Next","Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:270px 1fr}
button{font:inherit;color:inherit;cursor:pointer}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:10px;min-height:0}
.new{background:linear-gradient(135deg,#7c5cff,#ff7ab6 60%,var(--acc));color:#fff;border:0;border-radius:12px;padding:10px;font-weight:700}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}
.chat{display:flex;align-items:center;gap:6px;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--mut)}
.chat.on{background:var(--panel);color:var(--ink)}
.chat span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat b{opacity:.5;font-weight:400;background:none;border:0}.chat b:hover{opacity:1}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--mut)}
.ghost:hover{color:var(--ink)}
section{display:flex;flex-direction:column;min-height:0;min-width:0}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
header h1{font-size:1.05rem;margin:0;flex:1}
#menu{display:none}
.orb{width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(circle at 30% 30%,#fff8,transparent 40%),conic-gradient(from 0deg,#7c5cff,#ff7ab6,#ff9f45,#7c5cff);animation:spin 9s linear infinite,breathe 4s ease-in-out infinite;box-shadow:0 0 18px #7c5cff77}
.orb.busy{animation:spin 1.6s linear infinite,breathe 1s ease-in-out infinite;box-shadow:0 0 34px #ff7ab6}
.orb.big{width:110px;height:110px;box-shadow:0 0 60px #7c5cff88}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{scale:1.12}}
#log{flex:1;overflow:auto;padding:22px 20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.row{display:flex;flex-direction:column;max-width:820px;width:100%;margin:0 auto}
.row.me{align-items:flex-end}
.msg{max-width:88%;padding:10px 15px;border-radius:16px;overflow-wrap:anywhere}
.me .msg{background:var(--me);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.ai .msg{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg code{background:#7c5cff22;padding:1px 5px;border-radius:5px;font:.88em ui-monospace,Menlo,monospace}
.msg h3,.msg h4{margin:.4em 0}.msg ul{margin:.3em 0;padding-left:1.3em}.msg a{color:var(--me)}
.code{margin:.6em 0;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.ch{display:flex;justify-content:space-between;padding:4px 10px;background:var(--side);font-size:.8rem;color:var(--mut)}
.ch button{background:none;border:0;color:var(--mut)}
pre{margin:0;padding:10px 12px;overflow:auto;background:#0b0e20;color:#e6e8ff;font:.88rem/1.5 ui-monospace,Menlo,monospace}
pre code{background:none;padding:0}
.acts{display:flex;gap:4px;margin-top:3px}.acts button{background:none;border:0;color:var(--mut);font-size:.8rem;padding:2px 8px;border-radius:8px}.acts button:hover{background:var(--side)}
.err{color:#e5484d}
.empty{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:560px}
.empty h2{margin:0;font-size:1.7rem;letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px}.chips button:hover{border-color:var(--me)}
form{display:flex;gap:8px;padding:10px 20px calc(16px + env(safe-area-inset-bottom,0px));max-width:860px;width:100%;margin:0 auto}
textarea,input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
#in{resize:none;max-height:170px}
:is(textarea,input,select,button):focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.go{background:var(--me);color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:700}
.mic{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px}.mic.on{background:#e5484d;color:#fff}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--ink);width:min(480px,92vw);padding:22px}
dialog::backdrop{background:#0008}
dialog label{display:block;margin:12px 0 4px;font-size:.88rem;color:var(--mut)}
@media(max-width:760px){body{grid-template-columns:1fr}aside{position:fixed;inset:0 25% 0 0;z-index:5;translate:-100%;transition:translate .2s}aside.open{translate:0}#menu{display:block}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<aside id="side">
  <button class="new" id="new">+ Ny samtale</button>
  <div id="list"></div>
  <button class="ghost" id="exp">Gem samtale (.md)</button>
  <button class="ghost" id="set">Indstillinger</button>
</aside>
<section>
  <header><button class="ghost" id="menu">☰</button><div class="orb" id="orb"></div><h1 id="ttl">Min AI</h1></header>
  <div id="log"></div>
  <form id="f">
    <button type="button" class="mic" id="mic" title="Tal til AI'en" hidden>🎤</button>
    <textarea id="in" rows="1" placeholder="Skriv eller tal…" required></textarea>
    <button class="go" id="go">Send</button>
  </form>
</section>
<dialog id="dlg"><form method="dialog" id="sf">
  <h2 style="margin:0 0 4px">Indstillinger</h2>
  <label for="s-key">OpenAI-nøgle (gemmes kun i din browser)</label><input id="s-key" type="password" placeholder="sk-..." autocomplete="off">
  <label for="s-name">AI'ens navn</label><input id="s-name">
  <label for="s-model">Model</label><select id="s-model"><option>gpt-4o-mini</option><option>gpt-4o</option><option>gpt-4.1-mini</option><option>gpt-4.1</option></select>
  <label for="s-per">Personlighed</label><select id="s-per"></select>
  <label for="s-sys">Egen systemprompt (bruges ved “Egen”)</label><textarea id="s-sys" rows="3"></textarea>
  <label for="s-t">Kreativitet: <span id="tv"></span></label><input id="s-t" type="range" min="0" max="1.5" step="0.1" style="padding:0">
  <div style="display:flex;gap:8px;margin-top:16px"><button class="go" style="padding:10px 18px">Gem</button><button type="button" class="ghost" id="clr">Slet alle samtaler</button></div>
</form></dialog>
<script>
const $=id=>document.getElementById(id);
const PER={"Standard":"Du er en hjælpsom, venlig AI-assistent. Svar kort og klart.","Kodehjælper":"Du er en erfaren udvikler. Giv fungerende kode i kodeblokke og forklar kort.","Sarkastisk ven":"Du er en vittig, let sarkastisk ven, men altid hjælpsom og aldrig ond.","Lærer":"Forklar alt enkelt, som til en nysgerrig 12-årig, med eksempler.","Forfatter":"Du er en kreativ forfatter med levende sprog og fantasi.","Egen":""};
let S={chats:[],cur:null,cfg:{key:"",name:"Min AI",model:"gpt-4o-mini",per:"Standard",sys:"",t:0.7}};
try{const x=JSON.parse(localStorage.getItem("minai")||"null");if(x)S=Object.assign(S,x,{cfg:Object.assign(S.cfg,x.cfg)})}catch{}
const save=()=>{try{localStorage.setItem("minai",JSON.stringify(S))}catch{}};
const cur=()=>S.chats.find(c=>c.id===S.cur);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function md(src){return src.split("```").map((p,i)=>{
  if(i%2){const n=p.indexOf("\n"),l=n<0?"":p.slice(0,n).trim(),c=n<0?"":p.slice(n+1);
    return `<div class="code"><div class="ch"><span>${esc(l||"kode")}</span><button type="button" data-copy>Kopiér</button></div><pre><code>${esc(c)}</code></pre></div>`}
  return esc(p).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>")
   .replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
   .replace(/^#{1,2} (.*)$/gm,"<h3>$1</h3>").replace(/^### (.*)$/gm,"<h4>$1</h4>")
   .replace(/^(?:[-*] .*(?:\n|$))+/gm,m=>"<ul>"+m.trim().split("\n").map(l=>"<li>"+l.slice(2)+"</li>").join("")+"</ul>")
   .replace(/\n/g,"<br>").replace(/<\/(h3|h4|ul)><br>/g,"</$1>")}).join("")}

function newChat(){const c={id:Date.now(),title:"Ny samtale",msgs:[]};S.chats.unshift(c);S.cur=c.id;save();draw()}
function renderList(){$("list").innerHTML="";S.chats.forEach(c=>{const d=document.createElement("div");d.className="chat"+(c.id===S.cur?" on":"");
  d.innerHTML=`<span>${esc(c.title)}</span><b title="Slet">✕</b>`;
  d.onclick=e=>{if(e.target.tagName==="B"){S.chats=S.chats.filter(x=>x!==c);if(S.cur===c.id)S.cur=S.chats[0]?.id;if(!S.chats.length)return newChat()}else S.cur=c.id;save();draw();$("side").classList.remove("open")};
  $("list").append(d)})}
function row(role,html,i){const r=document.createElement("div");r.className="row "+(role==="user"?"me":"ai");r.dataset.i=i;
  r.innerHTML=`<div class="msg"></div>`+(role==="user"?"":`<div class="acts"><button data-a="copy">Kopiér</button><button data-a="say">Læs op</button><button data-a="redo">Prøv igen</button></div>`);
  r.firstChild[role==="user"?"textContent":"innerHTML"]=html;$("log").append(r);$("log").scrollTop=1e9;return r.firstChild}
function draw(){const c=cur();$("ttl").textContent=S.cfg.name;document.title=S.cfg.name;renderList();$("log").innerHTML="";
  if(!c.msgs.length){$("log").innerHTML=`<div class="empty"><div class="orb big"></div><h2>Hej, jeg er ${esc(S.cfg.name)}</h2><div class="chips">${["Forklar sort hul simpelt","Skriv en joke om kaffe","Lav et Python-spil","Giv mig en madplan til ugen"].map(t=>`<button type="button" data-chip>${t}</button>`).join("")}</div></div>`;return}
  c.msgs.forEach((m,i)=>row(m.role,m.role==="user"?m.content:md(m.content),i))}

let ac=null;
function busy(b){$("orb").classList.toggle("busy",b);$("go").textContent=b?"Stop":"Send"}
async function ask(){
  const c=cur();if(!S.cfg.key){openSet();return}
  const sys=S.cfg.per==="Egen"?S.cfg.sys:PER[S.cfg.per];
  const bub=row("assistant","…",c.msgs.length);let out="";ac=new AbortController();busy(true);
  try{
    const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",signal:ac.signal,headers:{"Content-Type":"application/json",Authorization:"Bearer "+S.cfg.key},
      body:JSON.stringify({model:S.cfg.model,temperature:+S.cfg.t,stream:true,messages:[{role:"system",content:sys||PER.Standard},...c.msgs.slice(-30)]})});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error?.message||"Fejl "+r.status)}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const ls=buf.split("\n");buf=ls.pop();
      for(const l of ls){if(!l.startsWith("data: "))continue;const d=l.slice(6).trim();if(d==="[DONE]")continue;
        try{const t=JSON.parse(d).choices[0].delta.content;if(t){out+=t;bub.innerHTML=md(out);$("log").scrollTop=1e9}}catch{}}}
  }catch(e){if(e.name!=="AbortError"){bub.innerHTML=`<span class="err">${esc(e.message)}</span>`}}
  if(out)c.msgs.push({role:"assistant",content:out});else bub.parentElement.remove();
  ac=null;busy(false);save()}
function submit(text){const c=cur();if(!text.trim())return;if(!c.msgs.length){c.title=text.slice(0,36);renderList()}
  c.msgs.push({role:"user",content:text});save();draw();ask()}
$("f").onsubmit=e=>{e.preventDefault();if(ac){ac.abort();return}const t=$("in").value;$("in").value="";submit(t)};
$("in").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("f").requestSubmit()}};
$("log").onclick=e=>{const t=e.target;
  if(t.dataset.chip!==undefined)return submit(t.textContent);
  if(t.dataset.copy!==undefined){navigator.clipboard.writeText(t.closest(".code").querySelector("pre").innerText);t.textContent="Kopieret";return}
  const a=t.dataset.a;if(!a)return;const c=cur(),i=+t.closest(".row").dataset.i,m=c.msgs[i];
  if(a==="copy")navigator.clipboard.writeText(m.content);
  if(a==="say"){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m.content.replace(/```[\s\S]*?```/g," kodeblok "));u.lang="da-DK";speechSynthesis.speak(u)}
  if(a==="redo"&&!ac){c.msgs.splice(i);save();draw();ask()}};
$("new").onclick=()=>{newChat();$("side").classList.remove("open")};
$("menu").onclick=()=>$("side").classList.toggle("open");
$("exp").onclick=()=>{const c=cur(),a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([c.msgs.map(m=>(m.role==="user"?"## Dig\n":"## "+S.cfg.name+"\n")+m.content).join("\n\n")],{type:"text/markdown"}));a.download=c.title+".md";a.click()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){$("mic").hidden=false;const r=new SR();r.lang="da-DK";r.interimResults=true;
  r.onresult=e=>{$("in").value=[...e.results].map(x=>x[0].transcript).join("")};
  r.onend=()=>{$("mic").classList.remove("on");if($("in").value.trim())$("f").requestSubmit()};
  $("mic").onclick=()=>{$("mic").classList.contains("on")?r.stop():(r.start(),$("mic").classList.add("on"))}}
function openSet(){const c=S.cfg;$("s-key").value=c.key;$("s-name").value=c.name;$("s-model").value=c.model;$("s-per").value=c.per;$("s-sys").value=c.sys;$("s-t").value=c.t;$("tv").textContent=c.t;$("dlg").showModal()}
$("s-per").innerHTML=Object.keys(PER).map(k=>`<option>${k}</option>`).join("");
$("s-t").oninput=e=>$("tv").textContent=e.target.value;
$("set").onclick=openSet;
$("sf").onsubmit=()=>{S.cfg={key:$("s-key").value.trim(),name:$("s-name").value.trim()||"Min AI",model:$("s-model").value,per:$("s-per").value,sys:$("s-sys").value,t:$("s-t").value};save();draw()};
$("clr").onclick=()=>{if(confirm("Slette alle samtaler?")){S.chats=[];newChat();$("dlg").close()}};
if(!S.chats.length)newChat();else if(!cur())S.cur=S.chats[0].id;
draw();if(!S.cfg.key)setTimeout(openSet,400);
</script>
</body>
</html>
