<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VG CarInformation</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

header{
    padding:25px;
    text-align:center;
    background:#111a2e;
    border-bottom:1px solid #1f2a44;
}

header h1{
    margin:0;
    font-size:32px;
    color:#4cc9f0;
}

header p{
    color:#9aa7bd;
    margin-top:5px;
}

.search{
    text-align:center;
    margin:20px;
}

.search input{
    width:90%;
    max-width:500px;
    padding:15px;
    border-radius:10px;
    border:none;
    outline:none;
    font-size:16px;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#121c33;
    padding:15px;
    border-radius:15px;
    border:1px solid #1f2a44;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#4cc9f0;
}

.car-title{
    font-size:18px;
    margin-bottom:10px;
    color:#4cc9f0;
}

.spec{
    font-size:14px;
    color:#cbd5e1;
    margin:4px 0;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    background:#1f2a44;
    border-radius:6px;
    font-size:12px;
    margin-top:8px;
}

footer{
    text-align:center;
    padding:20px;
    color:#6b7a99;
    font-size:13px;
}
</style>
</head>

<body>

<header>
    <h1>VG CarInformation</h1>
    <p>Søg blandt biler – HK, topfart, værdi og specs</p>
</header>

<div class="search">
    <input id="searchInput" placeholder="Søg fx BMW, Audi, Tesla..." />
</div>

<div class="container" id="carContainer"></div>

<footer>
    VG CarInformation © 2026
</footer>

<script>
const cars = [
    {brand:"BMW", model:"320d Touring", year:2020, hp:190, top:230, torque:400, value:250000},
    {brand:"Audi", model:"A4 Avant", year:2021, hp:204, top:240, torque:400, value:310000},
    {brand:"Tesla", model:"Model 3 Long Range", year:2023, hp:498, top:233, torque:660, value:340000},
    {brand:"Mercedes-Benz", model:"C220d", year:2020, hp:194, top:240, torque:400, value:280000},
    {brand:"Volkswagen", model:"Golf GTI", year:2022, hp:245, top:250, torque:370, value:320000},
    {brand:"Toyota", model:"Corolla Hybrid", year:2021, hp:184, top:180, torque:190, value:210000},
    {brand:"Ford", model:"Focus ST", year:2020, hp:280, top:250, torque:420, value:270000},
    {brand:"Volvo", model:"V60 D4", year:2019, hp:190, top:220, torque:400, value:230000}
];

const container = document.getElementById("carContainer");
const searchInput = document.getElementById("searchInput");

function showCars(list){
    container.innerHTML = "";
    list.forEach(car=>{
        container.innerHTML += `
        <div class="card">
            <div class="car-title">${car.brand} ${car.model}</div>
            <div class="spec">🚗 Årgang: ${car.year}</div>
            <div class="spec">⚡ HK: ${car.hp}</div>
            <div class="spec">🏁 Topfart: ${car.top} km/t</div>
            <div class="spec">🔧 Moment: ${car.torque} Nm</div>
            <div class="spec">💰 Værdi: ${car.value.toLocaleString()} kr.</div>
            <div class="badge">VG CarInformation</div>
        </div>
        `;
    });
}

searchInput.addEventListener("input", (e)=>{
    const value = e.target.value.toLowerCase();
    const filtered = cars.filter(c =>
        c.brand.toLowerCase().includes(value) ||
        c.model.toLowerCase().includes(value)
    );
    showCars(filtered);
});

showCars(cars);
</script>

</body>
</html>
